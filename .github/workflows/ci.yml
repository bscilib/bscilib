name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; Mathlib builds are not cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean build and axiom footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Policy lint (no sorry, no stray axiom)
        run: python3 scripts/lint_axioms.py

      - name: Axiom footprint of flagship theorems
        run: ./scripts/check_axiom_footprint.sh

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        working-directory: python
        run: pip install -e ".[test]"

      - name: Test
        working-directory: python
        run: pytest -q

  cards:
    name: Statement card schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate cards
        run: python3 scripts/validate_cards.py
